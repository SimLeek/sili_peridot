# Runs on every commit. Hard gates: ruff, format, bandit, codespell,
# gitleaks, comment-limit. No C++ here (pure Python repo), so no
# clang-format/clang-tidy/cppcheck/shellcheck sections (mirrors sili__new's
# setup, minus the C++-only tools). Advisory-only tools (mypy, pydoclint,
# vulture, radon, lizard) live in tools/lint_all.sh instead -- mypy
# strict-mode found 219 pre-existing errors across 28 files in model/
# (never annotated before this lint setup existed); making it a hard gate
# now would block any future commit touching those files until a
# dedicated typing pass happens. Same story for pydoclint (dozens of
# docstring/signature mismatches). Promote to a hard gate once sili/ is
# clean.
#
# comment-limit (task #389, mirroring sili__new's now-complete pass,
# PR #45 there): 37 files in model/+scripts/ are over 30% comment
# density -- this is a research codebase with narrative embedded inline,
# not AI slop, and deciding what moves to docs/research/<file>.rst vs.
# stays inline is a real editorial call. Percentages below are the
# starting point for this pass:
# model/toy_tile_precision_models.py 52.5%, model/toy_beyond_context_task.py
# 48.4%, model/toy_tile_recurrence_rmt.py 48.2%,
# scripts/prototype_peak_synapse_learning_comparison.py 47.0%,
# scripts/l1_sparsity_probe.py 46.3%, model/eval_rank_floor.py 46.2%,
# model/curriculum.py 45.5%, scripts/train_mqar_curriculum.py 44.8%,
# model/toy_tile_recurrence_rmt_standard.py 44.5%,
# scripts/train_tile_curriculum.py 43.3%, model/eval_eigenvalues.py 43.3%,
# scripts/mqar_k1_precision_control.py 42.4%,
# model/toy_tile_recurrence_rmt_torch.py 40.9%, model/toy_recall_models.py
# 40.0%, model/eval_stuck_weights.py 39.4%,
# scripts/debug_energy_log_sigmas_runaway.py 39.0%,
# model/eval_superposition.py 38.8%,
# scripts/stochastic_stability_vs_scale_sparsity.py 38.2%,
# model/eval_quantization.py 37.7%, model/eval_lr.py 37.6%,
# scripts/torch_rnn_control.py 37.4%, scripts/lr_calibration_probe.py
# 37.0%, model/toy_recall_task.py 36.8%, model/sili_block.py 36.6%,
# scripts/train_toy_beyond_context_peak_eligibility_only.py 35.6%,
# scripts/stochastic_scale_dense_confirmation.py 35.5%, model/fold.py
# 35.4%, model/toy_precision_models.py 34.2%,
# scripts/train_toy_recall_comparison.py 33.1%,
# model/eval_output_collapse.py 33.0%, model/quantize.py 32.5%,
# scripts/disldo_no_bptt_ablation.py 32.2%, model/prune.py 31.5%,
# scripts/disldo_tanh_no_bptt_ablation.py 30.9%,
# scripts/mqar_k1_calibration.py 30.8%, model/sili_model.py 30.8%,
# model/eval_pruning.py 30.8%.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.2
    hooks:
      - id: bandit
        args: ["-c", ".bandit", "-r", "model", "scripts"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["--skip", "*.sst,*.safetensors,*.log"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: comment-limit
        name: comment density limit (<=30%)
        entry: python3 tools/comment_limit.py
        language: system
        types_or: [python]
        exclude: ^(tests/|model/toy_tile_precision_models\.py|model/toy_beyond_context_task\.py|model/toy_tile_recurrence_rmt\.py|scripts/prototype_peak_synapse_learning_comparison\.py|scripts/l1_sparsity_probe\.py|model/eval_rank_floor\.py|model/curriculum\.py|scripts/train_mqar_curriculum\.py|model/toy_tile_recurrence_rmt_standard\.py|scripts/train_tile_curriculum\.py|model/eval_eigenvalues\.py|scripts/mqar_k1_precision_control\.py|model/toy_tile_recurrence_rmt_torch\.py|model/toy_recall_models\.py|model/eval_stuck_weights\.py|scripts/debug_energy_log_sigmas_runaway\.py|model/eval_superposition\.py|scripts/stochastic_stability_vs_scale_sparsity\.py|model/eval_quantization\.py|model/eval_lr\.py|scripts/torch_rnn_control\.py|scripts/lr_calibration_probe\.py|model/toy_recall_task\.py|model/sili_block\.py|scripts/train_toy_beyond_context_peak_eligibility_only\.py|scripts/stochastic_scale_dense_confirmation\.py|model/fold\.py|model/toy_precision_models\.py|scripts/train_toy_recall_comparison\.py|model/eval_output_collapse\.py|model/quantize\.py|scripts/disldo_no_bptt_ablation\.py|model/prune\.py|scripts/disldo_tanh_no_bptt_ablation\.py|scripts/mqar_k1_calibration\.py|model/sili_model\.py|model/eval_pruning\.py)

      - id: pytest-fast
        name: pytest (fast suite, <10s -- excludes integration)
        entry: python3 -m pytest
        language: system
        pass_filenames: false
        always_run: true
