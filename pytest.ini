[pytest]
testpaths = tests
# Default `pytest` run stays fast (<10s) and 100% green: excludes real
# training-run tests (marked integration -- see e.g. test_train_mqar_curriculum.py,
# TestToyTileRecurrenceRealFP4LongHorizonStability). Run `pytest -m integration`
# explicitly to see those. `pytest -m ""` (empty string) runs everything unfiltered.
addopts = -m "not integration"
markers =
    integration: real training-run test (seconds, not milliseconds), not run by default or in pre-commit (run explicitly: pytest -m integration)
