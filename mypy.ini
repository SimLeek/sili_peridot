[mypy]
strict = True
warn_unreachable = True
# Ratchet note (mirrors sili__new's own tests/unit/python/ exclusion):
# scripts/ is ~90 one-off research probe/sweep scripts, not a maintained
# library surface -- strict-typing them all now would drown real findings
# in noise. model/ (the actual library code) stays fully strict. Promote
# scripts/ piecewise (or globally) once model/ is clean.
exclude = (?x)(
    ^scripts/
    | ^tests/
  )

# sili__new is an editable-installed sibling repo with no py.typed marker;
# torch/scipy stubs aren't installed in this venv. None of these are this
# repo's code to fix -- silence the import noise so real findings in
# model/ aren't drowned out.
[mypy-sili.*]
ignore_missing_imports = True
[mypy-torch.*]
ignore_missing_imports = True
[mypy-scipy.*]
ignore_missing_imports = True
